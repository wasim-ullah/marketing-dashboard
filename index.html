<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Performance Dashboard - BuyAnyInsurance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            display: none;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container.active {
            display: block;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .login-container .form-group {
            margin-bottom: 20px;
        }

        .login-container label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .login-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-container button:hover {
            transform: translateY(-2px);
        }

        .dashboard-container {
            display: none;
            width: 100%;
            background: white;
            min-height: 100vh;
            padding: 30px;
        }

        .dashboard-container.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .date-selector {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .date-selector h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .date-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .preset-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .date-input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .kpi-card h4 {
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 24px;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-card .value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .kpi-card .change {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .kpi-card .sub-metric {
            font-size: 14px;
            opacity: 1 !important;
            color: white !important;
            margin-top: 10px;
            line-height: 1.5;
            display: block;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .chart-container h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        canvas {
            max-height: 350px;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .table-container h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        table tbody tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .date-controls {
                flex-direction: column;
                align-items: flex-start;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container active" id="loginContainer">
        <h1>Marketing Dashboard</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Dashboard Screen -->
    <div class="dashboard-container" id="dashboardContainer">
        <div class="header">
            <h1>Marketing Performance Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="messageContainer"></div>

        <div class="date-selector">
            <h3>Select Date Range</h3>
            <div class="date-controls">
                <button class="preset-btn active" onclick="setDateRange(7)">Last 7 Days</button>
                <button class="preset-btn" onclick="setDateRange(30)">Last 30 Days</button>
                <button class="preset-btn" onclick="setDateRange(90)">Last 90 Days</button>
                <span style="color: #666; font-weight: 500;">Or select custom range:</span>
                <input type="date" id="dateFrom" class="date-input" onchange="loadDashboard()">
                <input type="date" id="dateTo" class="date-input" onchange="loadDashboard()">
            </div>
        </div>

        <div id="kpiCards" class="kpi-grid"></div>
        <div id="chartsContainer" class="charts-grid"></div>
        <div id="platformContainer" class="table-container"></div>
        <div id="tableContainer" class="table-container"></div>

        <div class="table-container" id="fbAdsSection">
            <h3 id="fbAdsHeading">Facebook Ad Spend</h3>
            <div id="fbAdsMessage"></div>
            <div id="fbKpiCards" class="kpi-grid"></div>
            <div id="fbCampaignsTable"></div>
        </div>

        <div class="table-container" id="googleAdsSection">
            <h3 id="googleAdsHeading">Google Ad Spend</h3>
            <div id="googleAdsMessage"></div>
            <div id="googleKpiCards" class="kpi-grid"></div>
            <div id="googleCampaignsTable"></div>
        </div>

        <div class="table-container" id="bingAdsSection">
            <h3 id="bingAdsHeading">Bing Ad Spend</h3>
            <div id="bingAdsMessage"></div>
            <div id="bingKpiCards" class="kpi-grid"></div>
            <div id="bingCampaignsTable"></div>
        </div>
    </div>

    <script>
        // Credentials
        const VALID_USERNAME = 'BuyAnyIns#2024@Analytics';
        const VALID_PASSWORD = 'K@m3l@h#Tr@ck1ng$Dashboard#Secure2024!';

        // Format number helper - handles string values with commas
        function formatNumber(value) {
            if (typeof value === 'string') {
                return parseFloat(value.replace(/,/g, ''));
            }
            return parseFloat(value) || 0;
        }

        // Format currency helper - AED (Dirhams)
        function formatCurrency(value) {
            const num = formatNumber(value);
            return 'Dhs ' + new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }).format(num || 0);
        }

        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('loginContainer').classList.remove('active');
                document.getElementById('dashboardContainer').classList.add('active');
                initializeDashboard();
            } else {
                alert('Invalid credentials. Please try again.');
            }
        });

        function logout() {
            sessionStorage.removeItem('authenticated');
            document.getElementById('dashboardContainer').classList.remove('active');
            document.getElementById('loginContainer').classList.add('active');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Check if user is authenticated
        function checkAuth() {
            const isAuthenticated = sessionStorage.getItem('authenticated');
            if (!isAuthenticated) {
                document.getElementById('loginContainer').classList.add('active');
                document.getElementById('dashboardContainer').classList.remove('active');
            } else {
                document.getElementById('loginContainer').classList.remove('active');
                document.getElementById('dashboardContainer').classList.add('active');
                initializeDashboard();
            }
        }

        // Initialize dashboard
        function initializeDashboard() {
            // Set default date range (last 7 days)
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            document.getElementById('dateTo').value = formatDate(today);
            document.getElementById('dateFrom').value = formatDate(sevenDaysAgo);

            loadDashboard();

            // Auto-refresh every 5 minutes
            setInterval(loadDashboard, 5 * 60 * 1000);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function setDateRange(days) {
            const today = new Date();
            const startDate = new Date(today.getTime() - days * 24 * 60 * 60 * 1000);

            document.getElementById('dateTo').value = formatDate(today);
            document.getElementById('dateFrom').value = formatDate(startDate);

            // Update active button
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            loadDashboard();
        }

        async function loadDashboard() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            if (!dateFrom || !dateTo) {
                showMessage('Please select both start and end dates', 'error');
                return;
            }

            AD_PLATFORMS.forEach(p => { document.getElementById(p.prefix + 'AdsMessage').innerHTML = ''; });

            // Skye KPIs and ad spend load together so spend can be allocated to Skye campaigns
            const [kpiResult, adsResult] = await Promise.allSettled([
                postJson('/api/fetch-dashboard', { dateFrom, dateTo }),
                postJson('/api/fetch-ads-spend', { startDate: dateFrom, endDate: dateTo })
            ]);

            let ads = null;
            if (adsResult.status === 'fulfilled' && adsResult.value.data) {
                ads = adsResult.value.data;
                AD_PLATFORMS.forEach(p => renderPlatform(p, ads));
            } else {
                const msg = adsResult.status === 'rejected' ? adsResult.reason.message : 'No ads data returned';
                AD_PLATFORMS.forEach(p => {
                    document.getElementById(p.prefix + 'AdsMessage').innerHTML = `<div class="error">Failed to load ${p.label} ads: ${msg}</div>`;
                });
            }

            if (kpiResult.status === 'rejected') {
                showMessage(`Failed to fetch dashboard: ${kpiResult.reason.message}`, 'error');
                console.error('Error:', kpiResult.reason);
                return;
            }
            const data = kpiResult.value;
            if (data.error) {
                showMessage(`Error: ${data.error}`, 'error');
                return;
            }
            renderDashboard(data, ads);
            showMessage('Dashboard updated successfully', 'success');
        }

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        }

        function brandIcon(name) {
            const i = BRAND_LOGOS[name];
            return `<span title="${i.title}" style="display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:#fff; border-radius:5px; margin-right:8px; vertical-align:middle; box-shadow:0 0 0 1px rgba(0,0,0,0.06);"><img src="${i.src}" alt="${i.title}" width="17" height="17" style="display:block;"></span>`;
        }

        const AD_PLATFORMS = [
            { key: 'facebook', label: 'Facebook', icon: brandIcon('meta'), prefix: 'fb' },
            { key: 'google', label: 'Google', icon: brandIcon('googleads'), prefix: 'google', scriptHome: 'Google Ads' },
            { key: 'bing', label: 'Bing', icon: brandIcon('bing'), prefix: 'bing', scriptHome: 'Microsoft Ads' }
        ];

        function renderPlatform(p, d) {
            document.getElementById(p.prefix + 'AdsHeading').innerHTML = `${p.icon}${p.label} Ad Spend`;
            const msg = document.getElementById(p.prefix + 'AdsMessage');
            const cards = document.getElementById(p.prefix + 'KpiCards');
            const tableDiv = document.getElementById(p.prefix + 'CampaignsTable');
            const err = d.errors && d.errors[p.key];
            const account = d[p.key + 'Account'];

            if (err) {
                msg.innerHTML = `<div class="error">${p.label}: ${err}</div>`;
            } else if (account) {
                let extra = '';
                if (account.updatedAt) {
                    const mins = Math.round((Date.now() - new Date(account.updatedAt).getTime()) / 60000);
                    const ago = mins < 60 ? `${mins} min ago` : mins < 2880 ? `${Math.round(mins / 60)} hours ago` : `${Math.round(mins / 1440)} days ago`;
                    extra += ` · updated ${ago}`;
                    if (mins > 180) extra += ` <strong style="color: #b45309;">(check the script schedule in ${p.scriptHome || p.label})</strong>`;
                }
                if (account.note) extra += ` · ${account.note}`;
                msg.innerHTML = `<p style="color: #666; margin-bottom: 15px;">Ad account: <strong>${account.name || '-'}</strong> (${account.id}) · billed in ${account.currency || '-'}${account.currency === 'USD' ? ', converted to Dhs at 3.67' : ''}${extra}</p>`;
            }

            const campaigns = (d.campaigns && d.campaigns[p.key + '_campaigns']) || {};
            let clicks = 0, impressions = 0;
            Object.values(campaigns).forEach(c => { clicks += c.clicks; impressions += c.impressions; });
            const spend = (d.spend && d.spend[p.key]) || 0;

            const kpis = [
                { title: `${p.icon}${p.label} Spend`, value: formatCurrency(spend) },
                { title: '🖱️ Clicks', value: clicks.toLocaleString() },
                { title: '👁️ Impressions', value: impressions.toLocaleString() },
                { title: '💲 Cost per Click', value: formatCurrency(clicks > 0 ? spend / clicks : 0) }
            ];
            cards.innerHTML = kpis.map(k =>
                `<div class="kpi-card"><h4>${k.title}</h4><div class="value">${k.value}</div></div>`
            ).join('');

            const rows = Object.entries(campaigns).sort((a, b) => b[1].spend - a[1].spend);
            if (rows.length === 0) {
                tableDiv.innerHTML = err ? '' : `<p style="color: #666; padding: 20px;">No ${p.label} campaigns with spend in this date range.</p>`;
                return;
            }
            tableDiv.innerHTML = `
                <table>
                    <thead><tr><th>Campaign</th><th>Spend</th><th>Clicks</th><th>Impressions</th><th>CPC</th></tr></thead>
                    <tbody>
                        ${rows.map(([name, c]) => `
                            <tr>
                                <td>${name}</td>
                                <td>${formatCurrency(c.spend)}</td>
                                <td>${c.clicks.toLocaleString()}</td>
                                <td>${c.impressions.toLocaleString()}</td>
                                <td>${formatCurrency(c.clicks > 0 ? c.spend / c.clicks : 0)}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        // Transform API response to flat metrics array
        function transformApiResponse(apiData) {
            const sources = apiData.data?.sources || [];
            const metrics = sources.map(source => ({
                channel: source.channel,
                source: source.utm_source,
                campaign: source.utm_campaign,
                language: source.language,
                ...source.metrics
            }));
            return metrics;
        }

        function renderDashboard(apiResponse, ads) {
            try {
                const metrics = transformApiResponse(apiResponse);
                const comparison = buildPlatformComparison(metrics, ads);
                renderKPIs(metrics, ads ? comparison.total.spend : null);
                renderCharts(metrics);
                renderPlatformComparison(comparison);
                renderTable(metrics);
            } catch (error) {
                showMessage(`Error rendering dashboard: ${error.message}`, 'error');
                console.error('Render error:', error);
            }
        }

        // ---- Platform-level comparison: ad spend vs Skye results ----
        // A Skye row's platform comes from its UTM source (falls back to channel).
        const PLATFORM_PATTERNS = {
            facebook: /facebook|\bfb\b|meta|instagram|\big\b/i,
            google: /google|adwords|\bgads\b|youtube/i,
            bing: /bing|microsoft|\bmsads\b|\bmsn\b/i
        };

        function platformOf(m) {
            for (const text of [m.source, m.channel]) {
                if (!text) continue;
                for (const key of Object.keys(PLATFORM_PATTERNS)) {
                    if (PLATFORM_PATTERNS[key].test(String(text))) return key;
                }
            }
            return null;
        }

        function buildPlatformComparison(skyeMetrics, ads) {
            const blank = () => ({ spend: 0, leads: 0, newLeads: 0, sales: 0, revenue: 0, sources: new Set() });
            const rows = {};
            AD_PLATFORMS.forEach(p => {
                rows[p.key] = { ...blank(), label: `${p.icon}${p.label}`, spend: (ads && ads.spend && ads.spend[p.key]) || 0, adSpendLoaded: !!ads };
            });
            rows.other = { ...blank(), label: 'Other sources (organic, direct, etc.)', other: true };

            skyeMetrics.forEach(m => {
                const key = platformOf(m) || 'other';
                const r = rows[key];
                r.leads += formatNumber(m.total_leads || 0);
                r.newLeads += formatNumber(m.new_leads || 0);
                r.sales += formatNumber(m.total_sales || 0);
                r.revenue += formatNumber(m.total_revenue || 0);
                if (m.source) r.sources.add(m.source);
                if (key === 'other') r.spend += formatNumber(m.marketing_spend || 0); // Skye's own spend for non-ad sources
            });

            const list = [...AD_PLATFORMS.map(p => rows[p.key]), rows.other];
            const total = list.reduce((t, r) => ({
                spend: t.spend + r.spend, leads: t.leads + r.leads, newLeads: t.newLeads + r.newLeads,
                sales: t.sales + r.sales, revenue: t.revenue + r.revenue
            }), { spend: 0, leads: 0, newLeads: 0, sales: 0, revenue: 0 });
            return { list, total };
        }

        function renderPlatformComparison(cmp) {
            const box = document.getElementById('platformContainer');
            const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const ratio = (a, b) => b > 0 ? a / b : null;
            const money = (v) => v === null ? '-' : formatCurrency(v);
            const line = (r, label, isTotal) => {
                const cpl = ratio(r.spend, r.leads);
                const cps = ratio(r.spend, r.sales);
                const conv = ratio(r.sales, r.leads);
                const roas = ratio(r.revenue, r.spend);
                const sources = r.sources && r.sources.size ? `<span style="display:block; font-size: 11px; color: #888;">UTM source: ${[...r.sources].map(esc).join(', ')}</span>` : '';
                const tag = isTotal ? 'th' : 'td';
                return `<tr${isTotal ? ' style="background: #f8f9fa;"' : ''}>
                    <${tag} style="text-align: left;">${label}${isTotal ? '' : sources}</${tag}>
                    <${tag}>${formatCurrency(r.spend)}</${tag}>
                    <${tag}>${r.leads.toLocaleString()}</${tag}>
                    <${tag}>${r.newLeads.toLocaleString()}</${tag}>
                    <${tag}>${r.sales.toLocaleString()}</${tag}>
                    <${tag}>${formatCurrency(r.revenue)}</${tag}>
                    <${tag}>${money(cpl)}</${tag}>
                    <${tag}>${money(cps)}</${tag}>
                    <${tag}>${conv === null ? '-' : (conv * 100).toFixed(2) + '%'}</${tag}>
                    <${tag}>${roas === null ? '-' : roas.toFixed(2) + 'x'}</${tag}>
                </tr>`;
            };
            box.innerHTML = `
                <h3>Performance by Platform</h3>
                <table>
                    <thead><tr>
                        <th>Platform</th><th>Spend</th><th>Leads</th><th>New Leads</th><th>Sales</th><th>Revenue</th>
                        <th>Cost/Lead</th><th>Cost/Sale</th><th>Conversion %</th><th>ROAS</th>
                    </tr></thead>
                    <tbody>
                        ${cmp.list.map(r => line(r, r.label, false)).join('')}
                        ${line(cmp.total, 'Total', true)}
                    </tbody>
                </table>
                <p style="color: #666; font-size: 13px; margin-top: 10px;">Spend for Facebook, Google and Bing comes from each ad platform; leads, sales and revenue come from Skye, grouped by UTM source. "Other sources" uses Skye's own spend figure.</p>`;
        }

        // spendOverride: total ad platform spend + Skye spend for other sources
        function renderKPIs(metrics, spendOverride) {
            const kpiContainer = document.getElementById('kpiCards');
            kpiContainer.innerHTML = '';

            // Calculate aggregated KPIs
            let totalLeads = 0;
            let deletedLeads = 0;
            let newLeads = 0;
            let totalSales = 0;
            let totalSpend = 0;
            let totalRevenue = 0;

            metrics.forEach(metric => {
                totalLeads += formatNumber(metric.total_leads || 0);
                deletedLeads += formatNumber(metric.deleted_leads || 0);
                newLeads += formatNumber(metric.new_leads || 0);
                totalSales += formatNumber(metric.total_sales || 0);
                totalSpend += formatNumber(metric.marketing_spend || 0);
                totalRevenue += formatNumber(metric.total_revenue || 0);
            });

            const conversionRate = totalLeads > 0 ? (totalSales / totalLeads) * 100 : 0;

            const kpis = [
                {
                    title: 'Total Leads',
                    value: totalLeads,
                    subvalue: deletedLeads,
                    sublabel: 'Deleted',
                    icon: '📊'
                },
                { title: 'New Leads', value: newLeads, icon: '✨' },
                { title: 'Sales', value: totalSales, icon: '💰' },
                { title: 'Marketing Spend', value: formatCurrency(spendOverride ?? totalSpend), icon: '💵' },
                { title: 'Total Revenue', value: formatCurrency(totalRevenue), icon: '📈' },
                { title: 'Conversion Rate', value: conversionRate.toFixed(2) + '%', icon: '🎯' }
            ];

            kpis.forEach(kpi => {
                const card = document.createElement('div');
                card.className = 'kpi-card';
                let cardContent = `
                    <h4>${kpi.icon} ${kpi.title}</h4>
                    <div class="value">${typeof kpi.value === 'number' ? kpi.value.toLocaleString() : kpi.value}</div>
                `;

                // Add sub-metric if it exists (for deleted leads)
                if (kpi.subvalue !== undefined) {
                    cardContent += `
                        <div class="sub-metric">
                            <strong>${kpi.sublabel}:</strong> ${kpi.subvalue.toLocaleString()}
                        </div>
                    `;
                }

                card.innerHTML = cardContent;
                kpiContainer.appendChild(card);
            });
        }

        // Draws each value on the chart so numbers show without hovering
        const valueLabelsPlugin = {
            id: 'valueLabels',
            afterDatasetsDraw(chart, args, opts) {
                const { ctx } = chart;
                const format = opts.format || (v => v.toLocaleString());
                ctx.save();
                ctx.font = '600 11px -apple-system, Segoe UI, Roboto, sans-serif';
                ctx.fillStyle = '#333';
                chart.data.datasets.forEach((dataset, di) => {
                    chart.getDatasetMeta(di).data.forEach((el, i) => {
                        const value = dataset.data[i];
                        if (value === null || value === undefined || (opts.hideZero && value === 0)) return;
                        let x = el.x, y = el.y;
                        if (chart.config.type === 'radar') {
                            // Push the label outward from the centre so it sits beside the point
                            const r = chart.scales.r;
                            const dx = x - r.xCenter, dy = y - r.yCenter;
                            const len = Math.hypot(dx, dy) || 1;
                            x += dx / len * 14;
                            y += dy / len * 14;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                        } else {
                            y -= 8;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                        }
                        ctx.fillText(format(value), x, y);
                    });
                });
                ctx.restore();
            }
        };

        function renderCharts(metrics) {
            const chartsContainer = document.getElementById('chartsContainer');
            chartsContainer.innerHTML = '';

            // Group by source for charts
            const bySource = {};
            metrics.forEach(m => {
                const source = m.source || 'Unknown';
                if (!bySource[source]) {
                    bySource[source] = {
                        total_leads: 0,
                        total_sales: 0,
                        total_revenue: 0
                    };
                }
                bySource[source].total_leads += formatNumber(m.total_leads || 0);
                bySource[source].total_sales += formatNumber(m.total_sales || 0);
                bySource[source].total_revenue += formatNumber(m.total_revenue || 0);
            });

            const sources = Object.keys(bySource);
            const leads = sources.map(s => bySource[s].total_leads);
            const conversions = sources.map(s => {
                const total = bySource[s].total_leads;
                return total > 0 ? (bySource[s].total_sales / total * 100) : 0;
            });

            // Bar Chart - Leads by Source
            const barChartDiv = document.createElement('div');
            barChartDiv.className = 'chart-container';
            barChartDiv.innerHTML = '<h3>Leads by Source</h3><canvas id="barChart"></canvas>';
            chartsContainer.appendChild(barChartDiv);

            new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: sources,
                    datasets: [{
                        label: 'Total Leads',
                        data: leads,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgb(102, 126, 234)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        valueLabels: { format: v => Math.round(v).toLocaleString() }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grace: '15%',
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        }
                    }
                },
                plugins: [valueLabelsPlugin]
            });

            // Radar Chart - Conversion Rate by Source
            const radarChartDiv = document.createElement('div');
            radarChartDiv.className = 'chart-container';
            radarChartDiv.innerHTML = '<h3>Conversion Rate by Source (%)</h3><canvas id="radarChart"></canvas>';
            chartsContainer.appendChild(radarChartDiv);

            new Chart(document.getElementById('radarChart'), {
                type: 'bar',
                data: {
                    labels: sources,
                    datasets: [{
                        label: 'Conversion Rate (%)',
                        data: conversions,
                        backgroundColor: 'rgba(118, 75, 162, 0.6)',
                        borderColor: 'rgb(118, 75, 162)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        valueLabels: { format: v => v.toFixed(1) + '%' }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 115, // headroom so labels on 100% bars stay clear of the legend
                            ticks: { stepSize: 10, callback: v => v <= 100 ? v + '%' : '' }
                        }
                    }
                },
                plugins: [valueLabelsPlugin]
            });
        }

        function renderTable(metrics) {
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = '<h3>Detailed Performance Metrics</h3>';

            if (metrics.length === 0) {
                tableContainer.innerHTML += '<p style="color: #666; padding: 20px;">No data available for the selected date range.</p>';
                return;
            }

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Channel</th>
                        <th>Source</th>
                        <th>Campaign</th>
                        <th>Total Leads</th>
                        <th>New Leads</th>
                        <th>Pending</th>
                        <th>Sales</th>
                        <th>Lost</th>
                        <th>Deleted</th>
                        <th>Revenue</th>
                        <th>Conversion %</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            `;

            const tbody = table.querySelector('tbody');

            metrics.forEach(metric => {
                const totalLeads = formatNumber(metric.total_leads || 0);
                const conversionRate = totalLeads > 0 ? (formatNumber(metric.total_sales || 0) / totalLeads) * 100 : 0;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${metric.channel || 'N/A'}</td>
                    <td>${metric.source || 'N/A'}</td>
                    <td>${metric.campaign || 'N/A'}</td>
                    <td>${totalLeads.toLocaleString()}</td>
                    <td>${formatNumber(metric.new_leads || 0).toLocaleString()}</td>
                    <td>${formatNumber(metric.pending_leads || 0).toLocaleString()}</td>
                    <td>${formatNumber(metric.total_sales || 0).toLocaleString()}</td>
                    <td>${formatNumber(metric.lost_leads || 0).toLocaleString()}</td>
                    <td>${formatNumber(metric.deleted_leads || 0).toLocaleString()}</td>
                    <td>${formatCurrency(metric.total_revenue || 0)}</td>
                    <td>${conversionRate.toFixed(2)}%</td>
                `;
                tbody.appendChild(row);
            });

            tableContainer.appendChild(table);
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Check authentication on page load
        checkAuth();
    </script>
</body>
</html>
